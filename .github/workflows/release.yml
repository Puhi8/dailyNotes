name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Everything here runs on free tiers: public repos get unlimited standard-runner
# minutes, GHCR is free for public packages, and Pages is free for public repos.
permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      # frontend/package.json is the version source; an existing tag means this
      # commit is not a release, so ordinary pushes to main do nothing.
      - id: version
        run: |
          tag="v$(node -p "require('./frontend/package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag is already released, skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $tag."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod

      # No npm cache: package-lock.json is gitignored, and setup-node needs a
      # lockfile to key the cache. Direct deps are pinned exactly in package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The default docker driver cannot --push; release.sh builds with buildx.
      - uses: docker/setup-buildx-action@v3

      - name: Install Android SDK packages and ImageMagick
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - run: npm install
        working-directory: frontend

      - name: Restore the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || {
            echo "Missing secret ANDROID_KEYSTORE_BASE64." >&2
            exit 1
          }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_REMOTE: origin
          # Empty secrets fall through to the debug-keystore defaults in build-android-apk.sh.
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          FRONTEND_DEPLOY_CMD: >-
            VITE_ROUTER_MODE=hash VITE_PUBLIC_BASE_PATH=/dailyNotes/ npm run build &&
            npx gh-pages -d dist -u "github-actions <github-actions@github.com>"
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        run: ./release.sh "${{ needs.check.outputs.tag }}"
